name: Sync Products (UmaPenca + UICLAP) → GitHub CDN + Supabase

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Store to sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - prataprint
          - bhumisprint
          - uiclap
      upload_images:
        description: 'Upload images to GitHub CDN'
        required: false
        type: boolean
        default: true
      sync_to_db:
        description: 'Sync to Supabase Database'
        required: false
        type: boolean
        default: true
  push:
    branches: [master, main]

permissions:
  contents: write
  packages: read

concurrency:
  group: bhumiadm-sync
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      umapenca_stores: ${{ steps.set-umapenca.outputs.stores }}
      run_uiclap: ${{ steps.set-uiclap.outputs.run }}
    steps:
      - id: set-umapenca
        run: |
          STORE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store || 'all' }}"
          if [ "$STORE" = "all" ]; then
            echo 'stores=["prataprint", "bhumisprint"]' >> "$GITHUB_OUTPUT"
          elif [ "$STORE" = "uiclap" ]; then
            echo 'stores=[]' >> "$GITHUB_OUTPUT"
          elif [ "$STORE" = "prataprint" ] || [ "$STORE" = "bhumisprint" ]; then
            echo "stores=[\"$STORE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'stores=["prataprint", "bhumisprint"]' >> "$GITHUB_OUTPUT"
          fi
      - id: set-uiclap
        run: |
          STORE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store || 'all' }}"
          if [ "$STORE" = "all" ] || [ "$STORE" = "uiclap" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  sync-umapenca:
    name: Sync ${{ matrix.store }} (UmaPenca)
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.umapenca_stores != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.generate-matrix.outputs.umapenca_stores) }}

    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: BhumiAdm
      CDN_BRANCH: cdn
      UPLOAD_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_images || 'true' }}
      SYNC_TO_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_to_db || 'true' }}

    steps:
      - name: Checkout BhumiAdm repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          repository: ${{ github.repository_owner }}/BhumiAdm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r .github/workflows/scripts/shared/requirements.txt

      - name: Create output directory
        run: mkdir -p data/${{ matrix.store }}

      - name: Configure store parameters
        id: store-config
        run: |
          STORE="${{ matrix.store }}"
          if [ "$STORE" = "prataprint" ]; then
            echo "url=https://prataprint.bhumisparshaschool.org" >> $GITHUB_OUTPUT
            echo "store_id=11210" >> $GITHUB_OUTPUT
            echo "collection=prata-print" >> $GITHUB_OUTPUT
          elif [ "$STORE" = "bhumisprint" ]; then
            echo "url=https://umapenca.com/bhumisprint" >> $GITHUB_OUTPUT
            echo "store_id=11205" >> $GITHUB_OUTPUT
            echo "collection=bhumi-print" >> $GITHUB_OUTPUT
          fi
          echo "subcollection=uma-penca" >> $GITHUB_OUTPUT

      - name: Run Scraper + Upload to CDN + Sync to DB
        id: sync
        run: |
          SCRIPT=".github/workflows/scripts/umapenca.py"
          OUTPUT="data/${{ matrix.store }}/products.json"
          CMD="python3 $SCRIPT --full --output $OUTPUT"
          CMD="$CMD --url ${{ steps.store-config.outputs.url }}"
          CMD="$CMD --store-id ${{ steps.store-config.outputs.store_id }}"
          CMD="$CMD --collection ${{ steps.store-config.outputs.collection }}"
          CMD="$CMD --subcollection ${{ steps.store-config.outputs.subcollection }}"
          CMD="$CMD --cdn-branch cdn"

          [ "${{ env.UPLOAD_IMAGES }}" = "true" ] && CMD="$CMD --upload-images"
          [ "${{ env.SYNC_TO_DB }}" = "true" ] && CMD="$CMD --sync-to-db"

          echo "Running: $CMD"
          eval $CMD

      - name: Verify products.json
        if: success()
        run: |
          OUTPUT="data/${{ matrix.store }}/products.json"
          python3 -c "
          import json
          with open('$OUTPUT') as f:
              data = json.load(f)
          print(f\"Store: {data.get('store',{}).get('name','?')}\")
          print(f\"Products: {data.get('total_products',0)}\")
          cats = {}
          for p in data.get('products',[]):
              c = p.get('category','?'); cats[c] = cats.get(c,0)+1
          print('Categories:', dict(cats))
          cdn_count = sum(1 for p in data.get('products',[]) if p.get('cdn_image_urls'))
          webp_count = sum(1 for p in data.get('products',[]) if p.get('cdn_webp_urls'))
          print(f'Products with CDN images: {cdn_count}')
          print(f'Products with WebP: {webp_count}')
          "

      - name: Upload products.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.store }}-${{ github.run_id }}
          path: data/${{ matrix.store }}/products.json
          retention-days: 30

      - name: Commit and push products.json
        if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.store }}/products.json
          git diff --staged --quiet || git commit -m "chore: update ${{ matrix.store }} products.json

          🤖 Generated with [Qoder](https://qoder.com)"
          git fetch origin ${{ github.ref_name }}
          git push --force-with-lease origin ${{ github.ref_name }}

      - name: Upload CDN images artifact
        if: success() && env.UPLOAD_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cdn-images-${{ matrix.store }}-${{ github.run_id }}
          path: cdn_images/
          retention-days: 7
          if-no-files-found: warn

      - name: Debug CDN images directory
        if: always() && env.UPLOAD_IMAGES == 'true'
        run: |
          echo "=== CDN Images Directory Debug ==="
          if [ -d "cdn_images" ]; then
            echo "cdn_images/ directory exists"
            file_count=$(find cdn_images -type f 2>/dev/null | wc -l)
            echo "File count: $file_count"
          else
            echo "cdn_images/ directory does NOT exist"
          fi

  sync-uiclap:
    name: Sync UICLAP Books
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.run_uiclap == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: BhumiAdm
      CDN_BRANCH: cdn
      UPLOAD_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_images || 'true' }}
      SYNC_TO_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_to_db || 'true' }}

    steps:
      - name: Checkout BhumiAdm repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          repository: ${{ github.repository_owner }}/BhumiAdm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r .github/workflows/scripts/shared/requirements.txt

      - name: Create output directory
        run: mkdir -p data/uiclap

      - name: Run UICLAP Scraper + Upload to CDN + Sync to DB
        id: sync
        run: |
          SCRIPT=".github/workflows/scripts/uiclap.py"
          OUTPUT="data/uiclap/products.json"
          CMD="python3 $SCRIPT --output $OUTPUT"
          CMD="$CMD --bio-url https://uiclap.bio/levikarmadrum"
          CMD="$CMD --collection bhumi-livros"
          CMD="$CMD --subcollection uiclap"
          CMD="$CMD --fetch-details"
          CMD="$CMD --cdn-branch cdn"

          [ "${{ env.UPLOAD_IMAGES }}" = "true" ] && CMD="$CMD --upload-images"
          [ "${{ env.SYNC_TO_DB }}" = "true" ] && CMD="$CMD --sync-to-db"

          echo "Running: $CMD"
          eval $CMD

      - name: Verify products.json
        if: success()
        run: |
          OUTPUT="data/uiclap/products.json"
          python3 -c "
          import json
          with open('$OUTPUT') as f:
              data = json.load(f)
          print(f\"Source: {data.get('source','?')}\")
          print(f\"Books: {data.get('total_products',0)}\")
          cdn_count = sum(1 for p in data.get('products',[]) if p.get('cdn_image_urls'))
          webp_count = sum(1 for p in data.get('products',[]) if p.get('cdn_webp_urls'))
          print(f'Products with CDN images: {cdn_count}')
          print(f'Products with WebP: {webp_count}')
          for b in data.get('products',[])[:3]:
              print(f\"  - {b.get('name','?')} | R\${b.get('price',0):.2f} | variants: {len(b.get('variants',[]))}\")
          "

      - name: Upload products.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-uiclap-${{ github.run_id }}
          path: data/uiclap/products.json
          retention-days: 30

      - name: Commit and push products.json
        if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/uiclap/products.json
          git diff --staged --quiet || git commit -m "chore: update uiclap products.json

          🤖 Generated with [Qoder](https://qoder.com)"
          git fetch origin ${{ github.ref_name }}
          git push --force-with-lease origin ${{ github.ref_name }}

      - name: Upload CDN images artifact
        if: success() && env.UPLOAD_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cdn-images-uiclap-${{ github.run_id }}
          path: cdn_images/
          retention-days: 7
          if-no-files-found: warn

      - name: Debug CDN images directory
        if: always() && env.UPLOAD_IMAGES == 'true'
        run: |
          echo "=== CDN Images Directory Debug ==="
          if [ -d "cdn_images" ]; then
            echo "cdn_images/ directory exists"
            file_count=$(find cdn_images -type f 2>/dev/null | wc -l)
            echo "File count: $file_count"
          else
            echo "cdn_images/ directory does NOT exist"
          fi

  verify-site:
    name: Verify Products on Site
    needs: [generate-matrix, sync-umapenca, sync-uiclap]
    if: >-
      always() &&
      (needs.generate-matrix.outputs.umapenca_stores != '[]' || needs.generate-matrix.outputs.run_uiclap == 'true') &&
      (needs.sync-umapenca.result == 'success' || needs.sync-umapenca.result == 'skipped') &&
      (needs.sync-uiclap.result == 'success' || needs.sync-uiclap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify and Clean Products
        run: |
          python3 << 'PYTHON_SCRIPT'
          import requests, os, sys

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          base = f'{url}/rest/v1'
          hdrs = {'apikey': key, 'Authorization': f'Bearer {key}', 'Prefer': 'return=minimal'}

          EXPECTED_MAPPINGS = {
              'bhumi-print': "Bhumi's Print",
              'prata-print': 'Prata Print'
          }

          print("=== Verifying Product Collection Assignments ===")

          def get_collection_id(slug):
              r = requests.get(f'{base}/collections?slug=eq.{slug}&select=id', headers=hdrs, timeout=15)
              if r.ok and r.json():
                  return r.json()[0]['id']
              return None

          def get_products_by_collection(collection_id):
              r = requests.get(f'{base}/products?collection_id=eq.{collection_id}&is_active=eq.true&select=id,name,brand', headers=hdrs, timeout=15)
              return r.json() if r.ok else []

          def delete_product(product_id):
              r = requests.delete(f'{base}/products?id=eq.{product_id}', headers=hdrs, timeout=15)
              return r.ok

          deleted_count = 0
          
          for slug, expected_brand in EXPECTED_MAPPINGS.items():
              collection_id = get_collection_id(slug)
              if not collection_id:
                  print(f"  [WARN] Collection '{slug}' not found")
                  continue
                  
              products = get_products_by_collection(collection_id)
              print(f"\nCollection '{slug}': {len(products)} products (expected brand: '{expected_brand}')")
              
              for p in products:
                  brand = p.get('brand', '')
                  if brand != expected_brand:
                      print(f"  [DELETE] '{p['name']}' has wrong brand '{brand}'")
                      if delete_product(p['id']):
                          deleted_count += 1
                          print(f"    -> Deleted product ID {p['id']}")
                      else:
                          print(f"    -> Failed to delete")
          
          print(f"\n=== Summary: {deleted_count} products cleaned up ===")
          
          print("\n=== Final Product Counts ===")
          for slug, expected_brand in EXPECTED_MAPPINGS.items():
              collection_id = get_collection_id(slug)
              if collection_id:
                  products = get_products_by_collection(collection_id)
                  print(f"  {slug}: {len(products)} products")
                  wrong_brands = [p['name'] for p in products if p.get('brand') != expected_brand]
                  if wrong_brands:
                      print(f"    [ERROR] Wrong brands: {wrong_brands}")
                  else:
                      print(f"    [OK] All brands correct: {expected_brand}")
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  push-cdn-images:
    name: Push CDN Images to CDN Branch
    needs: [sync-umapenca, sync-uiclap]
    if: >-
      always() &&
      (needs.sync-umapenca.result == 'success' || needs.sync-uiclap.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all CDN image artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-cdn-images
          pattern: cdn-images-*
          merge-multiple: true

      - name: Check for downloaded images
        id: check-images
        run: |
          if [ -d "downloaded-cdn-images" ] && [ "$(ls -A downloaded-cdn-images 2>/dev/null)" ]; then
            echo "has_images=true" >> $GITHUB_OUTPUT
            echo "Found CDN images to push"
          else
            echo "has_images=false" >> $GITHUB_OUTPUT
            echo "No CDN images found"
          fi

      - name: Push CDN images to cdn branch
        if: steps.check-images.outputs.has_images == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin cdn || true
          if git show-ref --verify --quiet refs/heads/cdn; then
            git checkout cdn
          else
            git checkout -b cdn origin/master
          fi
          mkdir -p cdn_images
          cp -r downloaded-cdn-images/* cdn_images/ 2>/dev/null || true
          git add cdn_images/
          git diff --staged --quiet || git commit -m "chore: upload CDN product images

          🤖 Generated with [Qoder](https://qoder.com)"
          git fetch origin cdn || true
          git push --force-with-lease origin cdn
          echo "Successfully pushed CDN images to cdn branch"

      - name: No images to push
        if: steps.check-images.outputs.has_images == 'false'
        run: echo "No CDN images to push - skipping"

  notify-failure:
    name: Notify on Failure
    needs: [generate-matrix, sync-umapenca, sync-uiclap, verify-site, push-cdn-images]
    if: >-
      failure() &&
      (needs.sync-umapenca.result == 'failure' || needs.sync-uiclap.result == 'failure' || needs.verify-site.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Product Sync Failed - Run #${github.run_number}`,
            body: `The product sync workflow failed.\n\n**Run:** ${github.server_url}/${github.repository}/actions/runs/${github.run_id}\n**Branch:** ${github.ref_name}`,
            labels: ['bug', 'automation']
          })
